AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 山屋惊魂 — API Gateway WebSocket + Lambda + DynamoDB

Parameters:
  StageName:
    Type: String
    Default: prod

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 29
    MemorySize: 256
    Environment:
      Variables:
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        GAMES_TABLE:       !Ref GamesTable
        WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'

# ══════════════════════════════════════════════════════════════════════════════
# Resources
# ══════════════════════════════════════════════════════════════════════════════
Resources:

  # ── DynamoDB Tables ──────────────────────────────────────────────────────────
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SwjhConnections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: connectionId, AttributeType: S }
        - { AttributeName: gameCode,     AttributeType: S }
      KeySchema:
        - { AttributeName: connectionId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: gameCode-index
          KeySchema:
            - { AttributeName: gameCode, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  GamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SwjhGames
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: gameCode, AttributeType: S }
      KeySchema:
        - { AttributeName: gameCode, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Lambda Functions ─────────────────────────────────────────────────────────
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: swjh-connect
      CodeUri: lambda/
      Handler: connect.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: swjh-disconnect
      CodeUri: lambda/
      Handler: disconnect.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GamesTable }
        - Statement:
            Effect: Allow
            Action: execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: swjh-message
      CodeUri: lambda/
      Handler: message.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GamesTable }
        - Statement:
            Effect: Allow
            Action: execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  # ── API Gateway WebSocket ────────────────────────────────────────────────────
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: swjh-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.type'

  # $connect
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ConnectIntegration}'

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations'

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$connect'

  # $disconnect
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${DisconnectIntegration}'

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations'

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$disconnect'

  # $default — 所有游戏消息
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${MessageIntegration}'

  MessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MessageFunction.Arn}/invocations'

  MessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MessageFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$default'

  # 部署 Stage
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [ConnectRoute, DisconnectRoute, DefaultRoute]
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:        !Ref WebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName:    !Ref StageName
      DefaultRouteSettings:
        ThrottlingBurstLimit:  100
        ThrottlingRateLimit:   50

# ══════════════════════════════════════════════════════════════════════════════
# Outputs — 部署后输出 WebSocket URL，填入 frontend/config.js
# ══════════════════════════════════════════════════════════════════════════════
Outputs:
  WebSocketURL:
    Description: "填入 frontend/config.js 的 WebSocket URL"
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
  ConnectionsTableName:
    Value: !Ref ConnectionsTable
  GamesTableName:
    Value: !Ref GamesTable
